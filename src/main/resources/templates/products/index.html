<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - CRUD Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">CRUD Spring Boot</a>
        <form th:action="@{/logout}" method="post" class="d-flex">
            <button class="btn btn-outline-danger btn-sm" type="submit">Cerrar Sesión</button>
        </form>
    </div>
</nav>

<div class="container mt-5">
    <div class="p-5 mb-4 bg-white rounded-3 shadow-sm text-center">
        <h1 class="display-5 fw-bold text-primary">¡Bienvenido al Sistema!</h1>
        <p class="col-md-8 fs-4 mx-auto text-muted">Has iniciado sesión correctamente con Spring Security.</p>
        <hr class="my-4">
        <a th:href="@{/products}" class="btn btn-primary btn-lg px-4 me-md-2">Ver Lista de Productos</a>
        <a th:href="@{/products/new}" class="btn btn-success btn-lg px-4">Crear Nuevo Producto</a>
    </div>
</div>
</body>
</html>
